<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YoRHa Dice Interface</title>
  <style>
    :root{
      --panel: rgba(30,30,30,0.78);
      --panel-2: rgba(55,55,55,0.78);
      --line: rgba(200,200,200,0.35);
      --text: #e8e8e8;
      --muted: #b7b7b7;
      --accent: #8e8e8e;
      --crit: #8fd6d1;
      --fail: #d47d7d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }

    body::before{
      content:"";
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.82)),
        url("yorha.png") center/cover no-repeat fixed;
    }

    body::after{
      content:"";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.025),
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 3px
        );
      opacity: .22;
    }

    #boot {
      position: fixed;
      inset: 0;
      background: #000;
      color: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      font-family: Consolas, monospace;
      font-size: 18px;
      padding: 24px;
      text-align: center;
    }

    #bootText {
      line-height: 1.8;
      white-space: pre-line;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      display: none;
    }

    .hero, .card {
      position: relative;
      background: var(--panel);
      border: 2px solid var(--line);
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
    }

    .hero {
      padding: 20px 24px;
      margin-bottom: 18px;
    }

    .hero::before, .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255,255,255,0.09);
      pointer-events: none;
    }

    .hero h1 {
      margin: 0;
      letter-spacing: 4px;
      font-weight: 600;
      font-size: 32px;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
    }

    .card {
      padding: 18px;
      margin-bottom: 18px;
    }

    h3 {
      margin: 0 0 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select, input, button {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
    }

    button {
      cursor: pointer;
      background: #676767;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .command {
      margin-top: 10px;
    }

    #trayWrap {
      margin-top: 14px;
      border: 2px solid var(--line);
      background: rgba(10,10,10,0.46);
      position: relative;
      overflow: hidden;
    }

    #trayWrap::before,
    #trayWrap::after {
      content:"";
      position:absolute;
      width:18px;
      height:18px;
      border:2px solid rgba(255,255,255,.2);
      pointer-events:none;
      z-index: 2;
    }

    #trayWrap::before{
      top:8px; left:8px;
      border-right:none; border-bottom:none;
    }

    #trayWrap::after{
      right:8px; bottom:8px;
      border-left:none; border-top:none;
    }

    #tray {
      width: 100%;
      height: 380px;
      display: block;
      background: transparent;
    }

    .resultBox {
      margin-top: 14px;
      border: 2px solid var(--line);
      background: rgba(20,20,20,0.4);
      padding: 14px;
      text-align: center;
      min-height: 120px;
    }

    .resultMain {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .resultSub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      min-height: 20px;
    }

    .highlight {
      margin-top: 8px;
      font-weight: 700;
      min-height: 20px;
    }

    .highlight.crit { color: var(--crit); }
    .highlight.fail { color: var(--fail); }

    .historyList {
      display: grid;
      gap: 8px;
      max-height: 500px;
      overflow: auto;
    }

    .historyItem {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      border: 2px solid var(--line);
      background: rgba(30,30,30,0.46);
      padding: 8px 10px;
    }

    .historySub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .historyTotal {
      font-size: 18px;
      font-weight: 700;
    }

    .statsGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .statBox {
      border: 2px solid var(--line);
      background: rgba(30,30,30,0.46);
      padding: 10px;
    }

    .statLabel {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .statValue {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .statsGrid {
        grid-template-columns: 1fr;
      }

      .page {
        padding: 14px;
      }

      #tray {
        height: 300px;
      }

      .resultMain {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>
  <div id="boot"><div id="bootText"></div></div>

  <div class="page" id="page">
    <div class="hero">
      <h1>YoRHa Dice Interface</h1>
      <p>Tactical Probability Engine • Stable Edition</p>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <h3>Dice Tray</h3>

          <div class="controls">
            <div>
              <label for="dieType">Die type</label>
              <select id="dieType">
                <option value="4">D4</option>
                <option value="6">D6</option>
                <option value="8">D8</option>
                <option value="10">D10</option>
                <option value="12">D12</option>
                <option value="20" selected>D20</option>
                <option value="100">D100</option>
              </select>
            </div>

            <div>
              <label for="diceCount">Number of dice</label>
              <input id="diceCount" type="number" min="1" max="12" value="1" />
            </div>

            <div>
              <label>&nbsp;</label>
              <button id="rollButton" type="button">ROLL</button>
            </div>
          </div>

          <div class="command">
            <label for="diceCommand">Command input</label>
            <input id="diceCommand" type="text" placeholder="Examples: 2d20+3, 4d6, 1d100" />
          </div>

          <div id="trayWrap">
            <canvas id="tray"></canvas>
          </div>

          <div class="resultBox">
            <div class="resultMain" id="resultMain">-</div>
            <div class="resultSub" id="resultSub">Awaiting input.</div>
            <div class="highlight" id="highlight"></div>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <h3>Statistics</h3>
          <div class="statsGrid">
            <div class="statBox"><div class="statLabel">Rolls</div><div class="statValue" id="statRolls">0</div></div>
            <div class="statBox"><div class="statLabel">Dice rolled</div><div class="statValue" id="statDice">0</div></div>
            <div class="statBox"><div class="statLabel">Average</div><div class="statValue" id="statAverage">-</div></div>
            <div class="statBox"><div class="statLabel">Highest</div><div class="statValue" id="statHigh">-</div></div>
            <div class="statBox"><div class="statLabel">D20 crits</div><div class="statValue" id="statCrits">0</div></div>
            <div class="statBox"><div class="statLabel">D20 nat1</div><div class="statValue" id="statFails">0</div></div>
          </div>
        </div>

        <div class="card">
          <h3>Roll History</h3>
          <div class="historyList" id="historyList"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      history: [],
      stats: {
        totalRollActions: 0,
        totalDiceRolled: 0,
        sumOfAllDice: 0,
        highestSingleDie: null,
        d20Crits: 0,
        d20Fails: 0
      }
    };

    const bootLines = [
      'YoRHa Tactical Support System',
      'Initializing probability engine...',
      'Loading tactical dice tray...',
      'System ready.'
    ];

    const bootText = document.getElementById('bootText');
    const page = document.getElementById('page');

    const dieTypeEl = document.getElementById('dieType');
    const diceCountEl = document.getElementById('diceCount');
    const rollButtonEl = document.getElementById('rollButton');
    const diceCommandEl = document.getElementById('diceCommand');

    const resultMainEl = document.getElementById('resultMain');
    const resultSubEl = document.getElementById('resultSub');
    const highlightEl = document.getElementById('highlight');

    const historyListEl = document.getElementById('historyList');

    const statRollsEl = document.getElementById('statRolls');
    const statDiceEl = document.getElementById('statDice');
    const statAverageEl = document.getElementById('statAverage');
    const statHighEl = document.getElementById('statHigh');
    const statCritsEl = document.getElementById('statCrits');
    const statFailsEl = document.getElementById('statFails');

    function bootSequence(i = 0) {
      if (i < bootLines.length) {
        bootText.textContent += bootLines[i] + '\n';
        setTimeout(() => bootSequence(i + 1), 650);
      } else {
        setTimeout(() => {
          document.getElementById('boot').style.display = 'none';
          page.style.display = 'block';
          resizeCanvas();
          drawTray();
        }, 700);
      }
    }

    function randomDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function parseDiceCommand(input) {
      const match = input.trim().toLowerCase().match(/^(\d*)d(\d+)([+-]\d+)?$/);
      if (!match) return null;
      return {
        count: Math.max(1, Math.min(12, parseInt(match[1] || '1', 10))),
        sides: parseInt(match[2], 10),
        modifier: parseInt(match[3] || '0', 10)
      };
    }

    function renderHistory() {
      historyListEl.innerHTML = '';
      if (state.history.length === 0) {
        const row = document.createElement('div');
        row.className = 'historyItem';
        row.innerHTML = '<div><strong>No rolls yet</strong><div class="historySub">Awaiting tactical input.</div></div><div class="historyTotal">-</div>';
        historyListEl.appendChild(row);
        return;
      }

      for (const item of state.history) {
        const row = document.createElement('div');
        row.className = 'historyItem';

        let suffix = '';
        if (item.critCount > 0) suffix += ' • Crit x' + item.critCount;
        if (item.failCount > 0) suffix += ' • Nat1 x' + item.failCount;
        if (item.modifier) suffix += ' • Mod ' + (item.modifier > 0 ? '+' : '') + item.modifier;

        row.innerHTML = `
          <div>
            <strong>${item.label}</strong>
            <div class="historySub">${item.rolls.join(', ')}${suffix}</div>
          </div>
          <div class="historyTotal">${item.total}</div>
        `;
        historyListEl.appendChild(row);
      }
    }

    function renderStats() {
      statRollsEl.textContent = state.stats.totalRollActions;
      statDiceEl.textContent = state.stats.totalDiceRolled;
      statAverageEl.textContent = state.stats.totalDiceRolled
        ? (state.stats.sumOfAllDice / state.stats.totalDiceRolled).toFixed(2)
        : '-';
      statHighEl.textContent = state.stats.highestSingleDie ?? '-';
      statCritsEl.textContent = state.stats.d20Crits;
      statFailsEl.textContent = state.stats.d20Fails;
    }

    function updateResult(entry) {
      resultMainEl.textContent = entry.total;
      resultSubEl.textContent =
        entry.rolls.join(' + ') +
        (entry.modifier ? ` ${entry.modifier > 0 ? '+' : '-'} ${Math.abs(entry.modifier)}` : '') +
        ` = ${entry.total}`;

      highlightEl.textContent = '';
      highlightEl.className = 'highlight';

      if (entry.sides === 20 && entry.critCount > 0) {
        highlightEl.textContent = entry.critCount > 1 ? `CRITICAL x${entry.critCount}` : 'CRITICAL';
        highlightEl.classList.add('crit');
      } else if (entry.sides === 20 && entry.failCount > 0) {
        highlightEl.textContent = entry.failCount > 1 ? `FAILURE x${entry.failCount}` : 'FAILURE';
        highlightEl.classList.add('fail');
      }
    }

    function recordRoll({ label, sides, rolls, modifier = 0 }) {
      const total = rolls.reduce((a, b) => a + b, 0) + modifier;
      const critCount = sides === 20 ? rolls.filter(v => v === 20).length : 0;
      const failCount = sides === 20 ? rolls.filter(v => v === 1).length : 0;

      state.stats.totalRollActions += 1;
      state.stats.totalDiceRolled += rolls.length;
      state.stats.sumOfAllDice += rolls.reduce((a, b) => a + b, 0);
      state.stats.highestSingleDie = Math.max(state.stats.highestSingleDie || 0, ...rolls);
      state.stats.d20Crits += critCount;
      state.stats.d20Fails += failCount;

      const entry = { label, sides, rolls, total, modifier, critCount, failCount };
      state.history.unshift(entry);
      if (state.history.length > 15) state.history.pop();

      updateResult(entry);
      renderStats();
      renderHistory();
    }

    let audioCtx = null;

    function getAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      return audioCtx;
    }

    function tone(freq, duration, type = 'sine', gainValue = 0.02, delay = 0) {
      const ctx = getAudio();
      if (!ctx) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      gain.gain.linearRampToValueAtTime(gainValue, ctx.currentTime + delay + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration + 0.02);
    }

    function playRollSound() {
      tone(180, 0.05, 'triangle', 0.018, 0);
      tone(240, 0.05, 'triangle', 0.018, 0.04);
      tone(320, 0.06, 'triangle', 0.015, 0.08);
    }

    function playCritSound() {
      tone(700, 0.08, 'sine', 0.022, 0);
      tone(900, 0.09, 'sine', 0.022, 0.05);
      tone(1200, 0.12, 'sine', 0.018, 0.1);
    }

    function playFailSound() {
      tone(200, 0.08, 'sawtooth', 0.018, 0);
      tone(150, 0.14, 'sawtooth', 0.018, 0.06);
    }

    rollButtonEl.addEventListener('mouseenter', () => tone(520, 0.03, 'square', 0.01, 0));

    const canvas = document.getElementById('tray');
    const ctx = canvas.getContext('2d');
    let diceSprites = [];
    let animationFrame = null;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * devicePixelRatio);
      canvas.height = Math.floor(rect.height * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    function drawDieSprite(die) {
      ctx.save();
      ctx.translate(die.x, die.y);
      ctx.rotate(die.angle);

      const size = die.size;
      const half = size / 2;
      const depth = Math.max(8, size * 0.16);

      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetX = 4;
      ctx.shadowOffsetY = 6;

      if (die.shape === 'square') {
        ctx.beginPath();
        ctx.moveTo(half, -half);
        ctx.lineTo(half + depth, -half - depth * 0.6);
        ctx.lineTo(half + depth, half - depth * 0.6);
        ctx.lineTo(half, half);
        ctx.closePath();
        ctx.fillStyle = die.sideFill;
        ctx.fill();
        ctx.strokeStyle = die.stroke;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(-half, -half);
        ctx.lineTo(half, -half);
        ctx.lineTo(half + depth, -half - depth * 0.6);
        ctx.lineTo(-half + depth, -half - depth * 0.6);
        ctx.closePath();
        ctx.fillStyle = die.topFill;
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = die.fill;
        ctx.fillRect(-half, -half, size, size);
        ctx.strokeRect(-half, -half, size, size);
      } else {
        const sidesMap = { triangle: 3, diamond: 4, pentagon: 5, hexagon: 6, octagon: 8 };
        const pts = sidesMap[die.shape] || 6;
        const points = [];

        for (let i = 0; i < pts; i++) {
          const a = (-Math.PI / 2) + (i * Math.PI * 2 / pts);
          points.push({
            x: Math.cos(a) * half,
            y: Math.sin(a) * half
          });
        }

        const backPoints = points.map(p => ({
          x: p.x + depth,
          y: p.y - depth * 0.6
        }));

        for (let i = 0; i < points.length; i++) {
          const next = (i + 1) % points.length;
          if (points[i].y < 0 && points[next].y < 0) continue;

          ctx.beginPath();
          ctx.moveTo(points[i].x, points[i].y);
          ctx.lineTo(points[next].x, points[next].y);
          ctx.lineTo(backPoints[next].x, backPoints[next].y);
          ctx.lineTo(backPoints[i].x, backPoints[i].y);
          ctx.closePath();
          ctx.fillStyle = die.sideFill;
          ctx.fill();
          ctx.strokeStyle = die.stroke;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        ctx.beginPath();
        points.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.fillStyle = die.fill;
        ctx.fill();
        ctx.strokeStyle = die.stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.shadowColor = 'transparent';
      ctx.fillStyle = '#1c1c1c';
      ctx.font = `bold ${Math.max(14, size * 0.32)}px Segoe UI`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(die.value), 0, 0);

      ctx.restore();
    }

    function drawTray() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      for (const die of diceSprites) {
        drawDieSprite(die);
      }
    }

    function stepDice() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;

      let moving = false;

      for (const die of diceSprites) {
        die.vy += 0.35;
        die.x += die.vx;
        die.y += die.vy;
        die.angle += die.spin;

        const half = die.size / 2;

        if (die.x + half > w) {
          die.x = w - half;
          die.vx *= -0.78;
          die.spin *= 0.9;
        }
        if (die.x - half < 0) {
          die.x = half;
          die.vx *= -0.78;
          die.spin *= 0.9;
        }
        if (die.y + half > h) {
          die.y = h - half;
          die.vy *= -0.68;
          die.vx *= 0.95;
          die.spin *= 0.92;
        }
        if (die.y - half < 0) {
          die.y = half;
          die.vy *= -0.78;
        }

        if (Math.abs(die.vx) > 0.08 || Math.abs(die.vy) > 0.08 || Math.abs(die.spin) > 0.01) {
          moving = true;
        } else {
          die.vx = 0;
          die.vy = 0;
          die.spin = 0;
        }
      }

      drawTray();

      if (moving) {
        animationFrame = requestAnimationFrame(stepDice);
      } else {
        animationFrame = null;
      }
    }

    function shapeForSides(sides) {
      switch (sides) {
        case 4: return 'triangle';
        case 6: return 'square';
        case 8: return 'diamond';
        case 10: return 'pentagon';
        case 12: return 'hexagon';
        case 20: return 'octagon';
        case 100: return 'octagon';
        default: return 'square';
      }
    }

    function throwDiceSprites(rolls, sides) {
      if (animationFrame) cancelAnimationFrame(animationFrame);

      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const shape = shapeForSides(sides);

      diceSprites = rolls.map((value, index) => {
        const crit = sides === 20 && value === 20;
        const fail = sides === 20 && value === 1;

        let fill = '#e5e1d5';
        let topFill = '#f3efe4';
        let sideFill = '#bdb8ab';
        let stroke = '#6a6a6a';

        if (crit) {
          fill = '#d7f3f0';
          topFill = '#edfdfb';
          sideFill = '#9fcfca';
          stroke = '#8fd6d1';
        }

        if (fail) {
          fill = '#f2d6d6';
          topFill = '#fae7e7';
          sideFill = '#c79f9f';
          stroke = '#d47d7d';
        }

        return {
          value,
          shape,
          size: Math.max(42, Math.min(68, 72 - rolls.length * 2)),
          x: w * 0.5 + (index - (rolls.length - 1) / 2) * 18,
          y: 40 + Math.random() * 30,
          vx: (Math.random() - 0.5) * 10,
          vy: Math.random() * 2,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.35,
          fill,
          topFill,
          sideFill,
          stroke
        };
      });

      drawTray();
      animationFrame = requestAnimationFrame(stepDice);
    }

    function runRoll(count, sides, modifier = 0, labelOverride = null) {
      const rolls = Array.from({ length: count }, () => randomDie(sides));

      const audio = getAudio();
      if (audio && audio.state === 'suspended') audio.resume();

      playRollSound();
      throwDiceSprites(rolls, sides);

      recordRoll({
        label: labelOverride || `${count}d${sides}${modifier ? (modifier > 0 ? '+' : '') + modifier : ''}`,
        sides,
        rolls,
        modifier
      });

      const critCount = sides === 20 ? rolls.filter(v => v === 20).length : 0;
      const failCount = sides === 20 ? rolls.filter(v => v === 1).length : 0;

      if (critCount > 0) {
        playCritSound();
      } else if (failCount > 0) {
        playFailSound();
      }
    }

    rollButtonEl.addEventListener('click', () => {
      const count = Math.max(1, Math.min(12, parseInt(diceCountEl.value || '1', 10)));
      const sides = parseInt(dieTypeEl.value, 10);
      diceCountEl.value = count;
      runRoll(count, sides, 0);
    });

    diceCommandEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const parsed = parseDiceCommand(diceCommandEl.value);
      if (!parsed) {
        resultMainEl.textContent = 'ERR';
        resultSubEl.textContent = 'Invalid command. Try 2d20+3';
        highlightEl.textContent = '';
        return;
      }

      runRoll(parsed.count, parsed.sides, parsed.modifier, diceCommandEl.value.trim().toLowerCase());
      diceCommandEl.value = '';
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      drawTray();
    });

    renderHistory();
    renderStats();
    bootSequence();
  </script>
</body>
</html>
