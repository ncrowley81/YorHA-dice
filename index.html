<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoRHa Dice Interface</title>

<style>

:root{
--panel:rgba(40,40,40,0.85);
--panel-light:rgba(60,60,60,0.85);
--line:#777;
--text:#e5e5e5;
--accent:#aaa;
--crit:#7fd;
--fail:#ff6a6a;
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Segoe UI,Arial;
color:var(--text);
background:black;
overflow-x:hidden;
}

/* background image */

body::before{
content:"";
position:fixed;
inset:0;
z-index:-2;
background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.85)),
url("yorha.png") center/cover no-repeat fixed;
}

/* scanlines */

body::after{
content:"";
position:fixed;
inset:0;
z-index:-1;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 3px);
opacity:.25;
}

/* boot screen */

#boot{
position:fixed;
inset:0;
background:black;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:monospace;
font-size:18px;
z-index:10;
}

.page{
max-width:900px;
margin:auto;
padding:30px;
display:none;
}

.hero{
background:var(--panel);
border:2px solid var(--line);
padding:20px;
margin-bottom:20px;
}

.hero h1{
margin:0;
letter-spacing:3px;
}

.card{
background:var(--panel);
border:2px solid var(--line);
padding:20px;
margin-bottom:20px;
}

/* controls */

.controls{
display:grid;
grid-template-columns:1fr 1fr auto;
gap:10px;
margin-bottom:15px;
}

input,select,button{
padding:10px;
border:2px solid var(--line);
background:var(--panel-light);
color:white;
font-size:14px;
}

button{
cursor:pointer;
background:#666;
}

button:hover{background:#888}

/* command input */

#diceCommand{
width:100%;
margin-top:10px;
}

/* result */

.result{
font-size:56px;
text-align:center;
margin-top:20px;
}

.highlight{
text-align:center;
margin-top:10px;
font-weight:bold;
}

/* dice */

.dice{
display:flex;
justify-content:center;
gap:15px;
margin-top:20px;
flex-wrap:wrap;
}

.die{
width:60px;
height:60px;
display:flex;
align-items:center;
justify-content:center;
background:#222;
border:2px solid #555;
font-size:20px;
animation:roll .7s ease;
}

.crit{border-color:var(--crit)}
.fail{border-color:var(--fail)}

@keyframes roll{
0%{transform:rotate(0)}
50%{transform:rotate(180deg)}
100%{transform:rotate(360deg)}
}

/* history */

.history-item{
display:flex;
justify-content:space-between;
border-bottom:1px solid #555;
padding:6px 0;
}

/* mobile */

@media(max-width:700px){

.controls{
grid-template-columns:1fr;
}

.result{
font-size:42px;
}

.page{
padding:15px;
}

}

</style>
</head>

<body>

<div id="boot">
<div id="bootText"></div>
</div>

<div class="page">

<div class="hero">
<h1>YoRHa Dice Interface</h1>
<p>Tactical Probability Engine</p>
</div>

<div class="card">

<div class="controls">

<select id="dieType">
<option value="4">D4</option>
<option value="6">D6</option>
<option value="8">D8</option>
<option value="10">D10</option>
<option value="12">D12</option>
<option value="20" selected>D20</option>
<option value="100">D100</option>
</select>

<input id="diceCount" type="number" value="1" min="1">

<button onclick="rollStandard()">ROLL</button>

</div>

<input id="diceCommand" placeholder="Command input (ex: 2d20+3)">

<div id="result" class="result">-</div>
<div id="highlight" class="highlight"></div>

<div id="dice" class="dice"></div>

</div>

<div class="card">
<h3>Roll History</h3>
<div id="history"></div>
</div>

</div>

<script>

/* boot screen */

const bootLines=[
"YoRHa Tactical Support System",
"Initializing probability engine...",
"Loading dice subsystem...",
"System ready."
]

const bootText=document.getElementById("bootText")

let i=0

function bootSequence(){
if(i<bootLines.length){
bootText.innerHTML+=bootLines[i]+"<br>"
i++
setTimeout(bootSequence,700)
}
else{
setTimeout(()=>{
document.getElementById("boot").style.display="none"
document.querySelector(".page").style.display="block"
},800)
}
}

bootSequence()

/* dice */

function rollDie(s){
return Math.floor(Math.random()*s)+1
}

function renderDice(rolls,sides){

const container=document.getElementById("dice")
container.innerHTML=""

rolls.forEach(r=>{

const d=document.createElement("div")
d.className="die"

if(sides===20 && r===20) d.classList.add("crit")
if(sides===20 && r===1) d.classList.add("fail")

d.textContent=r

container.appendChild(d)

})

}

function addHistory(label,total){

const row=document.createElement("div")
row.className="history-item"

row.innerHTML=`<div>${label}</div><strong>${total}</strong>`

document.getElementById("history").prepend(row)

}

/* normal roll */

function rollStandard(){

const sides=parseInt(dieType.value)
const count=parseInt(diceCount.value)

const rolls=[]

for(let i=0;i<count;i++){
rolls.push(rollDie(sides))
}

const total=rolls.reduce((a,b)=>a+b,0)

renderDice(rolls,sides)

result.textContent=total
highlight.textContent=""

if(sides===20 && rolls.includes(20)){
highlight.textContent="CRITICAL"
}

if(sides===20 && rolls.includes(1)){
highlight.textContent="FAILURE"
}

addHistory(count+"d"+sides,total)

}

/* command roll */

diceCommand.addEventListener("keydown",e=>{

if(e.key!=="Enter") return

const cmd=diceCommand.value.toLowerCase()

const match=cmd.match(/(\\d*)d(\\d+)([+\\-]\\d+)?/)

if(!match) return

const count=parseInt(match[1]||1)
const sides=parseInt(match[2])
const mod=parseInt(match[3]||0)

const rolls=[]

for(let i=0;i<count;i++){
rolls.push(rollDie(sides))
}

const total=rolls.reduce((a,b)=>a+b,0)+mod

renderDice(rolls,sides)

result.textContent=total

addHistory(cmd,total)

diceCommand.value=""

})

</script>

</body>
</html>
