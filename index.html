<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NieR Dice Interface</title>
<style>
:root{
  --bg:#e7e4d8;
  --panel:rgba(242,239,230,0.82);
  --panel-dark:rgba(222,217,201,0.88);
  --line:#b8b29e;
  --text:#1c1c1c;
  --muted:#5f5b4f;
  --accent:#9a9483;
  --crit:#586f73;
  --fail:#7a3a3a;
  --shadow:rgba(0,0,0,0.15);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:30px;
  position:relative;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    linear-gradient(rgba(231,228,216,0.35), rgba(231,228,216,0.45)),
    url("yorha.png") center center / cover no-repeat fixed;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.03),
    rgba(0,0,0,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity:.24;
}

.page{
  max-width:1000px;
  margin:auto;
  display:grid;
  gap:22px;
}

.hero,.card{
  background:var(--panel);
  border:2px solid var(--line);
  box-shadow:0 8px 24px var(--shadow);
  backdrop-filter:blur(4px);
  position:relative;
}

.hero{
  padding:22px 26px;
  opacity:0;
  transform:translateY(14px);
  animation:bootFade .8s ease forwards;
}

.hero::before,
.card::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(184,178,158,0.45);
  pointer-events:none;
}

.hero h1{
  margin:0;
  font-weight:600;
  letter-spacing:3px;
  font-size:32px;
  opacity:0;
  transform:translateY(10px);
  animation:bootFade .9s ease forwards;
  animation-delay:.1s;
}

.hero p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:14px;
  opacity:0;
  transform:translateY(8px);
  animation:bootFade .9s ease forwards;
  animation-delay:.25s;
}

.card{
  padding:18px;
  opacity:0;
  transform:translateY(14px);
  animation:bootFade .8s ease forwards;
}

.page > .card:nth-of-type(1){animation-delay:.35s}
.page > .card:nth-of-type(2){animation-delay:.48s}
.page > .card:nth-of-type(3){animation-delay:.6s}

h3{
  margin:0 0 12px;
  font-weight:600;
  letter-spacing:1px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  margin-bottom:16px;
}

label{
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

select,input,button{
  width:100%;
  padding:10px 11px;
  border:2px solid var(--line);
  background:var(--panel-dark);
  font-size:14px;
  color:var(--text);
}

button{
  background:var(--accent);
  color:#fff;
  font-weight:600;
  cursor:pointer;
  transition:transform .08s ease, filter .15s ease;
}

button:hover{filter:brightness(1.05)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.7;cursor:not-allowed}

.result-panel{
  border:2px solid var(--line);
  padding:18px;
  text-align:center;
  background:var(--panel-dark);
  position:relative;
  overflow:hidden;
  min-height:220px;
}

.result-panel::before,
.result-panel::after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  border:2px solid var(--line);
}

.result-panel::before{
  top:8px;
  left:8px;
  border-right:none;
  border-bottom:none;
}

.result-panel::after{
  right:8px;
  bottom:8px;
  border-left:none;
  border-top:none;
}

.main-total{
  font-size:60px;
  font-weight:700;
  letter-spacing:1px;
  margin-top:18px;
}

.detail-line{
  margin-top:6px;
  font-size:14px;
  color:var(--muted);
  min-height:20px;
}

.highlight-text{
  margin-top:8px;
  font-weight:700;
  min-height:20px;
  letter-spacing:1px;
}

.result-panel.crit{border-color:var(--crit)}
.result-panel.fail{border-color:var(--fail)}
.result-panel.flash{animation:flashPulse .4s ease}
.result-panel.glitch{animation:glitch .25s linear 2}

.dice-strip{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  margin-top:18px;
  perspective:900px;
  min-height:76px;
}

.die-chip{
  width:60px;
  height:60px;
  perspective:800px;
}

.die-cube{
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  animation:spin 1s cubic-bezier(.2,.8,.2,1);
}

.die-face{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel);
  border:2px solid var(--line);
  font-weight:700;
  font-size:18px;
  backface-visibility:hidden;
}

.die-face.front{transform:translateZ(30px)}
.die-face.back{transform:rotateY(180deg) translateZ(30px)}
.die-face.right{transform:rotateY(90deg) translateZ(30px)}
.die-face.left{transform:rotateY(-90deg) translateZ(30px)}
.die-face.top{transform:rotateX(90deg) translateZ(30px)}
.die-face.bottom{transform:rotateX(-90deg) translateZ(30px)}

.die-chip.crit .die-face{
  border-color:var(--crit);
  background:#edf3f3;
}

.die-chip.fail .die-face{
  border-color:var(--fail);
  background:#f3e8e8;
}

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat-box{
  border:2px solid var(--line);
  padding:10px;
  background:var(--panel-dark);
}

.stat-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}

.stat-value{
  font-size:24px;
  font-weight:700;
  margin-top:4px;
}

.history-list{
  display:grid;
  gap:8px;
}

.history-item{
  border:2px solid var(--line);
  padding:8px 10px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  background:var(--panel-dark);
}

.history-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.history-total{
  font-weight:700;
  font-size:18px;
}

@keyframes spin{
  0%{transform:rotateX(0) rotateY(0)}
  50%{transform:rotateX(360deg) rotateY(360deg)}
  100%{transform:rotateX(720deg) rotateY(720deg)}
}

@keyframes flashPulse{
  0%{box-shadow:0 0 0 rgba(88,111,115,0)}
  35%{box-shadow:0 0 0 999px rgba(255,255,255,0.26) inset}
  100%{box-shadow:0 0 0 rgba(88,111,115,0)}
}

@keyframes glitch{
  0%{transform:translate(0)}
  20%{transform:translate(-3px,1px)}
  40%{transform:translate(3px,-1px)}
  60%{transform:translate(-2px,2px)}
  80%{transform:translate(2px,-2px)}
  100%{transform:translate(0)}
}

@keyframes bootFade{
  from{opacity:0; transform:translateY(14px)}
  to{opacity:1; transform:translateY(0)}
}

@media(max-width:700px){
  .controls{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr}
  body{padding:16px}
}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <h1>DICE INTERFACE</h1>
    <p>Automated roll system • YoRHa Tactical Utility</p>
  </div>

  <div class="card">
    <div class="controls">
      <div>
        <label for="dieType">Die type</label>
        <select id="dieType">
          <option value="4">D4</option>
          <option value="6">D6</option>
          <option value="8">D8</option>
          <option value="10">D10</option>
          <option value="12">D12</option>
          <option value="20" selected>D20</option>
          <option value="100">D100</option>
        </select>
      </div>
      <div>
        <label for="diceCount">Number of dice</label>
        <input id="diceCount" type="number" min="1" max="20" value="1">
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="rollButton" type="button">ROLL</button>
      </div>
    </div>

    <div id="resultPanel" class="result-panel">
      <div id="mainTotal" class="main-total">-</div>
      <div id="detailLine" class="detail-line">Awaiting input.</div>
      <div id="highlightText" class="highlight-text"></div>
      <div id="diceStrip" class="dice-strip"></div>
    </div>
  </div>

  <div class="card">
    <h3>Statistics</h3>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-label">Rolls</div><div id="statRolls" class="stat-value">0</div></div>
      <div class="stat-box"><div class="stat-label">Dice rolled</div><div id="statDice" class="stat-value">0</div></div>
      <div class="stat-box"><div class="stat-label">Average</div><div id="statAverage" class="stat-value">-</div></div>
      <div class="stat-box"><div class="stat-label">Highest</div><div id="statHigh" class="stat-value">-</div></div>
      <div class="stat-box"><div class="stat-label">D20 crits</div><div id="statCrits" class="stat-value">0</div></div>
      <div class="stat-box"><div class="stat-label">D20 nat1</div><div id="statFails" class="stat-value">0</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Recent Rolls</h3>
    <div id="historyList" class="history-list"></div>
  </div>
</div>

<script>
const state = {
  history: [],
  stats: {
    totalRollActions: 0,
    totalDiceRolled: 0,
    sumOfAllDice: 0,
    highestSingleDie: null,
    d20Crits: 0,
    d20Fails: 0
  }
};

const dieTypeEl = document.getElementById('dieType');
const diceCountEl = document.getElementById('diceCount');
const rollButtonEl = document.getElementById('rollButton');
const mainTotalEl = document.getElementById('mainTotal');
const detailLineEl = document.getElementById('detailLine');
const highlightTextEl = document.getElementById('highlightText');
const diceStripEl = document.getElementById('diceStrip');
const resultPanelEl = document.getElementById('resultPanel');
const historyListEl = document.getElementById('historyList');
const statRollsEl = document.getElementById('statRolls');
const statDiceEl = document.getElementById('statDice');
const statAverageEl = document.getElementById('statAverage');
const statHighEl = document.getElementById('statHigh');
const statCritsEl = document.getElementById('statCrits');
const statFailsEl = document.getElementById('statFails');

let audioCtx = null;

function getAudio() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  return audioCtx;
}

function tone(freq, duration, type = 'sine', gainValue = 0.03, delay = 0) {
  const ctx = getAudio();
  if (!ctx) return;

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
  gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(gainValue, ctx.currentTime + delay + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration + 0.02);
}

function playHoverSound() {
  tone(520, 0.035, 'square', 0.012, 0);
}

function playRollSound() {
  tone(220, 0.07, 'triangle', 0.02, 0);
  tone(310, 0.07, 'triangle', 0.02, 0.05);
  tone(410, 0.09, 'triangle', 0.018, 0.1);
}

function playCritSound() {
  tone(660, 0.08, 'sine', 0.025, 0);
  tone(880, 0.10, 'sine', 0.025, 0.06);
  tone(1320, 0.12, 'sine', 0.02, 0.12);
}

function playPodCriticalVoice() {
  const ctx = getAudio();
  if (!ctx) return;

  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const mod = ctx.createOscillator();
  const gain = ctx.createGain();
  const modGain = ctx.createGain();

  osc.type = 'square';
  mod.type = 'triangle';

  osc.frequency.setValueAtTime(180, now);
  osc.frequency.linearRampToValueAtTime(220, now + 0.08);
  osc.frequency.linearRampToValueAtTime(160, now + 0.18);

  mod.frequency.setValueAtTime(24, now);
  modGain.gain.setValueAtTime(18, now);

  mod.connect(modGain);
  modGain.connect(osc.frequency);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(0.035, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

  osc.connect(gain);
  gain.connect(ctx.destination);

  mod.start(now);
  osc.start(now);
  mod.stop(now + 0.34);
  osc.stop(now + 0.36);
}

function playFailSound() {
  tone(240, 0.12, 'sawtooth', 0.02, 0);
  tone(170, 0.18, 'sawtooth', 0.02, 0.08);
}

function randomDie(sides) {
  return Math.floor(Math.random() * sides) + 1;
}

function createDie(value, sides, crit, fail) {
  const wrap = document.createElement('div');
  wrap.className = 'die-chip' + (crit ? ' crit' : '') + (fail ? ' fail' : '');

  const cube = document.createElement('div');
  cube.className = 'die-cube';

  ['front','back','right','left','top','bottom'].forEach((faceName, index) => {
    const face = document.createElement('div');
    face.className = 'die-face ' + faceName;
    face.textContent = index === 0 ? value : 'D' + sides;
    cube.appendChild(face);
  });

  wrap.appendChild(cube);
  return wrap;
}

function renderLatest(entry) {
  mainTotalEl.textContent = entry.total;
  detailLineEl.textContent = entry.rolls.join(' + ') + ' = ' + entry.total;
  highlightTextEl.textContent = '';
  resultPanelEl.classList.remove('crit', 'fail', 'flash', 'glitch');

  if (entry.critCount > 0) {
    highlightTextEl.textContent = entry.critCount > 1 ? 'CRITICAL x' + entry.critCount : 'CRITICAL';
    resultPanelEl.classList.add('crit', 'flash');
    playCritSound();
    playPodCriticalVoice();
    setTimeout(() => resultPanelEl.classList.remove('flash'), 420);
  } else if (entry.failCount > 0) {
    highlightTextEl.textContent = entry.failCount > 1 ? 'FAILURE x' + entry.failCount : 'FAILURE';
    resultPanelEl.classList.add('fail', 'glitch');
    playFailSound();
    setTimeout(() => resultPanelEl.classList.remove('glitch'), 520);
  }

  diceStripEl.innerHTML = '';
  entry.rolls.forEach(value => {
    const isCrit = value === 20 && entry.sides === 20;
    const isFail = value === 1 && entry.sides === 20;
    diceStripEl.appendChild(createDie(value, entry.sides, isCrit, isFail));
  });
}

function renderHistory() {
  historyListEl.innerHTML = '';

  if (state.history.length === 0) {
    const row = document.createElement('div');
    row.className = 'history-item';
    row.innerHTML = '<div><strong>No rolls yet</strong><div class="history-sub">Roll something glorious.</div></div><div class="history-total">-</div>';
    historyListEl.appendChild(row);
    return;
  }

  state.history.forEach(item => {
    const row = document.createElement('div');
    row.className = 'history-item';

    let suffix = '';
    if (item.critCount > 0) suffix += ' • Crit x' + item.critCount;
    if (item.failCount > 0) suffix += ' • Nat1 x' + item.failCount;

    row.innerHTML = `
      <div>
        <strong>${item.label}</strong>
        <div class="history-sub">${item.rolls.join(', ')}${suffix}</div>
      </div>
      <div class="history-total">${item.total}</div>
    `;

    historyListEl.appendChild(row);
  });
}

function renderStats() {
  statRollsEl.textContent = state.stats.totalRollActions;
  statDiceEl.textContent = state.stats.totalDiceRolled;
  statAverageEl.textContent = state.stats.totalDiceRolled
    ? (state.stats.sumOfAllDice / state.stats.totalDiceRolled).toFixed(2)
    : '-';
  statHighEl.textContent = state.stats.highestSingleDie ?? '-';
  statCritsEl.textContent = state.stats.d20Crits;
  statFailsEl.textContent = state.stats.d20Fails;
}

function rollDice() {
  const sides = parseInt(dieTypeEl.value, 10);
  const count = Math.max(1, Math.min(20, parseInt(diceCountEl.value, 10) || 1));
  diceCountEl.value = count;

  playRollSound();

  const rolls = Array.from({ length: count }, () => randomDie(sides));
  const total = rolls.reduce((sum, value) => sum + value, 0);
  const critCount = sides === 20 ? rolls.filter(v => v === 20).length : 0;
  const failCount = sides === 20 ? rolls.filter(v => v === 1).length : 0;

  state.stats.totalRollActions += 1;
  state.stats.totalDiceRolled += count;
  state.stats.sumOfAllDice += total;
  state.stats.highestSingleDie = Math.max(state.stats.highestSingleDie || 0, ...rolls);
  state.stats.d20Crits += critCount;
  state.stats.d20Fails += failCount;

  state.history.unshift({
    label: count + 'd' + sides,
    rolls,
    total,
    critCount,
    failCount
  });

  if (state.history.length > 12) {
    state.history.pop();
  }

  renderLatest({
    sides,
    count,
    rolls,
    total,
    critCount,
    failCount
  });

  renderHistory();
  renderStats();
}

rollButtonEl.addEventListener('click', () => {
  const ctx = getAudio();
  if (ctx && ctx.state === 'suspended') {
    ctx.resume();
  }
  rollDice();
});

rollButtonEl.addEventListener('mouseenter', playHoverSound);

renderHistory();
renderStats();
</script>
</body>
</html>
